<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AquaRev Logo Marquee (master)</title>
<!-- Master for the client-logo strip directly under the home page hero. The only file you edit;
     build-marquee.sh generates the CSS, JS, Webflow embed and preview from it. Scoped under #arlm.
     Logo heights (--h) are optically balanced: h = sqrt(4000 / aspect), clamped 26–52 px, then
     hand-tuned; width/height attributes carry each file's real aspect so nothing distorts or shifts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
<style>
#arlm{
  --ink:rgba(255,255,255,.8); --label:rgba(201,220,236,.7); --gut:clamp(20px,5vw,96px); --s:1;
  position:relative; isolation:isolate; width:100%; overflow:hidden;
  padding:clamp(26px,3.2vw,44px) 0 clamp(30px,3.8vw,52px);
  background:linear-gradient(180deg,#011838 0%,#040f1e 100%);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color:#fff;
}
#arlm::before{content:""; position:absolute; left:var(--gut); right:var(--gut); top:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(110,243,255,.28),transparent)}
#arlm, #arlm *, #arlm *::before, #arlm *::after{box-sizing:border-box}
#arlm :where(p,ul,li,img,button,svg){margin:0;padding:0;border:0;font:inherit;color:inherit;background:none;max-width:none}
#arlm :where(ul){list-style:none}

#arlm .arlm-label{
  padding:0 var(--gut); margin-bottom:clamp(16px,1.8vw,24px); text-align:center;
  font:600 clamp(.7rem,.64rem + .2vw,.8125rem)/1.4 'Inter',system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--label);
}

/* Without JS (or with reduced motion) the logos sit in a centred, wrapping row. */
#arlm .arlm-viewport{position:relative; padding:0 var(--gut)}
#arlm .arlm-track{display:flex; justify-content:center}
#arlm .arlm-list{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; row-gap:18px}
#arlm .arlm-list li{flex:none; display:flex; align-items:center; justify-content:center; height:64px; padding:0 clamp(22px,2.9vw,46px)}
#arlm .arlm-list img{display:block; width:auto; height:calc(var(--h,40px) * var(--s)); opacity:.8; transition:opacity .3s ease}
#arlm .arlm-list li:hover img{opacity:1}

/* Running marquee: two identical lists side by side, the track slides exactly one list width. */
#arlm.is-running .arlm-viewport{padding:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
#arlm.is-running .arlm-track{justify-content:flex-start; width:max-content; animation:arlm-slide var(--dur,60s) linear infinite; will-change:transform}
#arlm.is-running .arlm-list{flex-wrap:nowrap}
#arlm.is-running .arlm-viewport:hover .arlm-track,
#arlm.is-paused .arlm-track,
#arlm.is-offscreen .arlm-track{animation-play-state:paused}
@keyframes arlm-slide{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}

/* Pause / play (WCAG 2.2.2) */
#arlm .arlm-motion{
  position:absolute; right:var(--gut); top:calc(clamp(26px,3.2vw,44px) - 8px); z-index:2;
  width:32px; height:32px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  background:rgba(1,15,38,.6); border:1px solid rgba(255,255,255,.28); color:#fff; opacity:.7; transition:opacity .2s ease,background .2s ease;
}
#arlm .arlm-motion:hover, #arlm .arlm-motion:focus-visible{opacity:1; background:rgba(1,15,38,.9)}
#arlm .arlm-motion:focus-visible{outline:3px solid #fff; outline-offset:2px}
#arlm .arlm-motion[hidden]{display:none}
#arlm .arlm-motion svg{width:12px; height:12px}
#arlm .arlm-motion .i-play{display:none}
#arlm .arlm-motion[aria-pressed="true"] .i-play{display:block}
#arlm .arlm-motion[aria-pressed="true"] .i-pause{display:none}

@media (max-width:767px){
  #arlm{--s:.76}
  #arlm .arlm-list li{height:52px; padding:0 20px}
  #arlm .arlm-label{padding:0 64px}
  #arlm .arlm-motion{right:16px}
  #arlm.is-running .arlm-viewport{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
}
@media (prefers-reduced-motion:reduce){
  #arlm.is-running .arlm-track{animation:none}
}

/* ---------- preview page only (not used on the site) ---------- */
body{margin:0; background:#040f1e}
</style>
</head>
<body>
<section id="arlm" aria-labelledby="arlm-label">
  <p class="arlm-label" id="arlm-label">Trusted at properties across leading hotel &amp; resort brands</p>
  <div class="arlm-viewport">
    <div class="arlm-track">
      <ul class="arlm-list">
        <li style="--h:40px"><img src="logos/ritz-carlton.svg" width="103" height="40" alt="The Ritz-Carlton" decoding="async"></li>
        <li style="--h:40px"><img src="logos/hilton.svg" width="98" height="40" alt="Hilton" decoding="async"></li>
        <li style="--h:50px"><img src="logos/marriott.png" width="67" height="50" alt="Marriott" decoding="async"></li>
        <li style="--h:31px"><img src="logos/wyndham.svg" width="136" height="31" alt="Wyndham Hotels &amp; Resorts" decoding="async"></li>
        <li style="--h:37px"><img src="logos/ihg.svg" width="103" height="37" alt="IHG Hotels &amp; Resorts" decoding="async"></li>
        <li style="--h:29px"><img src="logos/best-western.png" width="145" height="29" alt="Best Western Hotels &amp; Resorts" decoding="async"></li>
        <li style="--h:50px"><img src="logos/holiday-inn.svg" width="62" height="50" alt="Holiday Inn" decoding="async"></li>
        <li style="--h:46px"><img src="logos/the-kahala.svg" width="87" height="46" alt="The Kahala Hotel &amp; Resort" decoding="async"></li>
        <li style="--h:50px"><img src="logos/ymca.svg" width="65" height="50" alt="YMCA" decoding="async"></li>
        <li style="--h:35px"><img src="logos/ocean-bungalows.svg" width="116" height="35" alt="The Ocean Bungalows at Turtle Bay" decoding="async"></li>
        <li style="--h:48px"><img src="logos/days-inn.png" width="80" height="48" alt="Days Inn by Wyndham" decoding="async"></li>
        <li style="--h:41px"><img src="logos/super-8.png" width="95" height="41" alt="Super 8 by Wyndham" decoding="async"></li>
        <li style="--h:35px"><img src="logos/howard-johnson.png" width="109" height="35" alt="Howard Johnson by Wyndham" decoding="async"></li>
      </ul>
    </div>
  </div>
  <button class="arlm-motion" type="button" aria-pressed="false" aria-label="Pause logo scrolling" hidden><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="9.6" y="2" width="3.4" height="12" rx="1" fill="currentColor"/></svg><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9.4-5.8a.8.8 0 0 0 0-1.4L5.2 1.5A.8.8 0 0 0 4 2.2z" fill="currentColor"/></svg></button>
</section>
<script>
(function(){
  var root = document.getElementById('arlm'); if (!root) return;
  var track = root.querySelector('.arlm-track');
  var list = track.querySelector('.arlm-list');
  var btn = root.querySelector('.arlm-motion');
  var KEY = 'arlm-motion-off';
  var SPEED = 34;                       // px per second, the same at every screen width
  var reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
  var userOff = false;
  try { userOff = localStorage.getItem(KEY) === '1'; } catch (e) {}

  // Second, identical copy for the seamless loop; hidden from screen readers and not focusable.
  var clone = list.cloneNode(true);
  clone.setAttribute('aria-hidden', 'true');
  clone.classList.add('arlm-clone');
  [].forEach.call(clone.querySelectorAll('img'), function(img){ img.alt = ''; });
  track.appendChild(clone);

  function setDuration(){
    var w = list.getBoundingClientRect().width;
    if (w > 0) root.style.setProperty('--dur', (w / SPEED).toFixed(2) + 's');
  }
  function sync(){
    var on = !reduce.matches;
    root.classList.toggle('is-running', on);
    clone.style.display = on ? '' : 'none';
    root.classList.toggle('is-paused', userOff);
    btn.hidden = !on;
    btn.setAttribute('aria-pressed', userOff ? 'true' : 'false');
    btn.setAttribute('aria-label', userOff ? 'Play logo scrolling' : 'Pause logo scrolling');
    if (on) setDuration();
  }

  btn.addEventListener('click', function(){
    userOff = !userOff;
    try { localStorage.setItem(KEY, userOff ? '1' : '0'); } catch (e) {}
    sync();
  });
  if (reduce.addEventListener) reduce.addEventListener('change', sync); else if (reduce.addListener) reduce.addListener(sync);
  if ('ResizeObserver' in window) new ResizeObserver(setDuration).observe(list);
  else window.addEventListener('resize', setDuration);
  // Pause while off screen or in a background tab, so it costs nothing when nobody is looking.
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ root.classList.toggle('is-offscreen', !es[0].isIntersecting); }, { rootMargin:'100px 0px' }).observe(root);
  }
  sync();
})();
</script>
</body>
</html>
